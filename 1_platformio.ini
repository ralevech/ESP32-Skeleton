; БЛОК 1: ESP32 (Семейство Xtensa LX6)
; ==========================================
; 1. ESP32 DEVKIT V1 (самая стандартная)
; ==========================================
[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
upload_port = COM5                         
monitor_speed = 115200
monitor_port = COM5

; ==========================================
; 2. ESP32 WROOM / WROVER (Generic)
; Если плата без названия, но чип ESP32-D0WD
; ==========================================
[env:esp32-wroom-32]
platform = espressif32
board = esp32-wroom-32
framework = arduino
upload_port = COM5
monitor_speed = 115200

; ==========================================
; 3. ESP32-S2 (USB родной, часто порт определяется как /dev/ttyACM* или COM*)
; ==========================================
[env:esp32-s2-saola-1]
platform = espressif32
board = esp32-s2-saola-1
framework = arduino
upload_port = COM5                          ; Может быть COM3, если через USB-UART
monitor_speed = 115200

; ==========================================
; 4. ESP32-C3 (RISC-V, дешёвый аналог ESP8266)
; ==========================================
[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
upload_port = COM5
monitor_speed = 115200