;БЛОК 3: STM32 (Blue Pill / Black Pill)
; ==========================================
; 7. STM32F103C8 (Blue Pill) - заливка через ST-Link V2
; ==========================================
[env:bluepill_f103c8_stlink]
platform = ststm32
board = bluepill_f103c8
framework = arduino
upload_protocol = stlink                  ; Подключаем ST-Link, порт не нужен
debug_tool = stlink
monitor_speed = 115200

; ==========================================
; 8. STM32F103C8 (Blue Pill) - заливка через UART (Serial) - ногами BOOT0
; ==========================================
[env:bluepill_f103c8_serial]
platform = ststm32
board = bluepill_f103c8
framework = arduino
upload_protocol = serial                  ; Потребуется USB-UART адаптер
upload_port = COM5
monitor_speed = 115200

; ==========================================
; 9. STM32F411CE (Black Pill) - очень быстрый
; ==========================================
[env:blackpill_f411ce]
platform = ststm32
board = blackpill_f411ce
framework = arduino
upload_protocol = stlink
debug_tool = stlink
monitor_speed = 115200